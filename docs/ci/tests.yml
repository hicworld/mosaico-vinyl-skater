name: Desktop checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install desktop dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify native source snapshot
        run: python tools/build_renderer.py --check
      - name: Verify original demo
        run: python tools/create_demo.py --verify
      - name: Run tests without audio or a connected board
        run: python -m unittest discover -s tests -v
